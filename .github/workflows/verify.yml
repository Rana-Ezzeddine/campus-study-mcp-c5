name: Verify MCP toolkit

on:
  push:
    paths:
      - 'campus_toolkit/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*'
      - 'pyproject.toml'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Record resolved versions
        run: python -m pip freeze
      - name: Run tests and real MCP round trips
        run: python scripts/verify.py
      - name: Retain actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-python-${{ matrix.python }}
          path: evidence/
