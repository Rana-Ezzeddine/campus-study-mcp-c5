name: Live OpenAI agent verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify real agent routing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'Configure the OPENAI_API_KEY repository secret to run the live agent.'
            exit 1
          fi
          python scripts/verify.py --live
      - name: Retain actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-agent-verification
          path: evidence/
